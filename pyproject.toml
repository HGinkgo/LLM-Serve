[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llmserve"
version = "0.3.0"
authors = [{ name = "pengfei_he", email = "pengfei_he@foxmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "A single-host LLM inference runtime focused on serving systems, scheduling, KV cache management, and inference optimization."
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "ninja",
    "triton>=3.0.0",
    "transformers>=4.51.0,<5.0.0",
    "flash-attn",
    "packaging>=20.0",
    "xxhash",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.115,<1.0",
    "httpx2>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
llmserve = "llmserve.cli:main"

[project.urls]
Homepage="https://github.com/HGinkgo/LLM-Serve"

[tool.setuptools.packages.find]
where = ["."]
include = ["llmserve*", "benchmarks*"]
